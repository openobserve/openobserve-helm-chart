suite: per-install generated secrets
release:
  name: oo
  namespace: o2
tests:
  - it: runs the generator as a Helm pre-install/pre-upgrade hook and an Argo CD PreSync hook
    template: templates/secret-generator-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'state ZO_ROOT_USER_PASSWORD password 32 '
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'state ZO_EXT_AUTH_SALT token 32 - no'
  - it: renders no generator when disabled and the root user is set
    template: templates/secret-generator-job.yaml
    set:
      secretGenerator.enabled: false
      auth.ZO_ROOT_USER_EMAIL: admin@acme.test
      auth.ZO_ROOT_USER_PASSWORD: S3cure-Pass-For-Tests
    asserts:
      - hasDocuments:
          count: 0
  - it: fails when disabled and the root user is missing
    template: templates/secret.yaml
    set:
      secretGenerator.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "secretGenerator.enabled is false, so set: auth.ZO_ROOT_USER_EMAIL, auth.ZO_ROOT_USER_PASSWORD"
  - it: keeps generated keys out of the chart Secret when they are not set
    template: templates/secret.yaml
    asserts:
      - notExists:
          path: stringData.ZO_ROOT_USER_EMAIL
      - notExists:
          path: stringData.ZO_ROOT_USER_PASSWORD
      - notExists:
          path: stringData.ZO_TRACING_HEADER_VALUE
      - notExists:
          path: stringData.ZO_INTERNAL_GRPC_TOKEN
  - it: renders the values the user sets, with the tracing header built from them
    template: templates/secret.yaml
    set:
      auth.ZO_ROOT_USER_EMAIL: admin@acme.test
      auth.ZO_ROOT_USER_PASSWORD: S3cure-Pass-For-Tests
      auth.ZO_EXT_AUTH_SALT: salt-for-tests-0123456789
    asserts:
      - equal:
          path: stringData.ZO_ROOT_USER_PASSWORD
          value: S3cure-Pass-For-Tests
      - equal:
          path: stringData.ZO_TRACING_HEADER_VALUE
          value: Basic YWRtaW5AYWNtZS50ZXN0OlMzY3VyZS1QYXNzLUZvci1UZXN0cw==
      - equal:
          path: stringData.ZO_EXT_AUTH_SALT
          value: salt-for-tests-0123456789
  - it: gives the pod generated values through explicit env, after the existing root Secret refs
    template: templates/openobserve-statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZO_ROOT_USER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: oo-openobserve-standalone-generated
                key: ZO_ROOT_USER_PASSWORD
                optional: true
      - equal:
          path: spec.template.spec.containers[0].envFrom[1]
          value:
            secretRef:
              name: oo-openobserve-standalone-generated
  - it: generates no root user with existingRootUserSecret and leaves the tracing header empty
    template: templates/secret.yaml
    set:
      auth.existingRootUserSecret.name: my-root
    asserts:
      - notExists:
          path: stringData.ZO_ROOT_USER_PASSWORD
      - equal:
          path: stringData.ZO_TRACING_HEADER_VALUE
          value: ""
  - it: reads the root user from existingRootUserSecret, not the generated Secret
    template: templates/openobserve-statefulset.yaml
    set:
      auth.existingRootUserSecret.name: my-root
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZO_ROOT_USER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-root
                key: ZO_ROOT_USER_PASSWORD
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZO_ROOT_USER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: oo-openobserve-standalone-generated
                key: ZO_ROOT_USER_PASSWORD
                optional: true
  - it: gives o2ai the effective root user for MCP when O2_MCP_* are empty
    template: templates/o2ai-deployment.yaml
    set:
      enterprise.enabled: true
      enterprise.o2ai.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: O2_MCP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: oo-openobserve-standalone-generated
                key: ZO_ROOT_USER_PASSWORD
  - it: gives o2ai the MCP credentials the user set
    template: templates/o2ai-deployment.yaml
    set:
      enterprise.enabled: true
      enterprise.o2ai.enabled: true
      auth.O2_MCP_USERNAME: mcp@acme.test
      auth.O2_MCP_PASSWORD: Mcp-Pass-For-Tests1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: O2_MCP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: oo-openobserve-standalone
                key: O2_MCP_PASSWORD
  - it: fails a new install against a cluster that sets a published default
    template: templates/secret.yaml
    set:
      auth.ZO_ROOT_USER_EMAIL: root@example.com
    kubernetesProvider:
      scheme:
        "v1/ServiceAccount":
          gvr:
            version: v1
            resource: serviceaccounts
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: default
            namespace: o2
    asserts:
      - failedTemplate:
          errorPattern: "must not be used on a new install: auth.ZO_ROOT_USER_EMAIL"
  - it: does not fail without cluster access (helm template, Argo CD)
    template: templates/secret.yaml
    set:
      auth.ZO_ROOT_USER_PASSWORD: "Complexpass#123"
    asserts:
      - notFailedTemplate: {}
  - it: tells the user how to read the generated root credentials on install, without values
    template: templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: "kubectl get secret --namespace o2 oo-openobserve-standalone-generated -o jsonpath='\\{.data.ZO_ROOT_USER_EMAIL\\}' \\| base64 -d"
      - matchRegexRaw:
          pattern: "port-forward svc/oo-openobserve-standalone 5080:5080"
  - it: warns on upgrade, without printing the value
    template: templates/NOTES.txt
    release:
      upgrade: true
    set:
      auth.ZO_ROOT_USER_PASSWORD: "Complexpass#123"
    asserts:
      - matchRegexRaw:
          pattern: "- auth.ZO_ROOT_USER_PASSWORD"
      - notMatchRegexRaw:
          pattern: "Complexpass"
