suite: credential-class config values live in the Secret
tests:
  - it: renders the values into the Secret unchanged
    template: templates/secret.yaml
    set:
      config.ZO_INTERNAL_GRPC_TOKEN: grpc-token
      config.ZO_TRACING_HEADER_VALUE: Basic dGVzdA==
      config.ZO_USAGE_REPORTING_CREDS: usage-creds
      config.ZO_ALERT_CHART_SIGNING_KEY: signing-key
    asserts:
      - equal:
          path: stringData.ZO_INTERNAL_GRPC_TOKEN
          value: grpc-token
      - equal:
          path: stringData.ZO_TRACING_HEADER_VALUE
          value: Basic dGVzdA==
      - equal:
          path: stringData.ZO_USAGE_REPORTING_CREDS
          value: usage-creds
      - equal:
          path: stringData.ZO_ALERT_CHART_SIGNING_KEY
          value: signing-key
  - it: keeps them out of the ConfigMap
    template: templates/configmap.yaml
    set:
      config.ZO_INTERNAL_GRPC_TOKEN: grpc-token
      config.ZO_TRACING_HEADER_VALUE: Basic dGVzdA==
      config.ZO_USAGE_REPORTING_CREDS: usage-creds
      config.ZO_ALERT_CHART_SIGNING_KEY: signing-key
    asserts:
      - notExists:
          path: data.ZO_INTERNAL_GRPC_TOKEN
      - notExists:
          path: data.ZO_TRACING_HEADER_VALUE
      - notExists:
          path: data.ZO_USAGE_REPORTING_CREDS
      - notExists:
          path: data.ZO_ALERT_CHART_SIGNING_KEY
  - it: keeps the chart's default tracing header value when none is set
    template: templates/secret.yaml
    asserts:
      - equal:
          path: stringData.ZO_TRACING_HEADER_VALUE
          value: Basic cm9vdEBleGFtcGxlLmNvbTpDb21wbGV4cGFzcyMxMjM=
  - it: restarts OpenObserve when anything in the Secret changes
    template: templates/openobserve-statefulset.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/secret"]
      - notExists:
          path: spec.template.metadata.annotations["checksum/config-secrets"]
