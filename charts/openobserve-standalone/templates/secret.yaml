apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openobserve.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "openobserve.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
{{- include "openobserve.validateSecrets" . }}
{{- /* Keys the hook Job can generate are rendered here only when set, so an empty value never hides */}}
{{- /* the generated one (the pod loads the generated Secret first and this Secret second). */}}
stringData:
  {{- if not .Values.auth.existingRootUserSecret.name }}
  {{- with .Values.auth.ZO_ROOT_USER_EMAIL }}
  ZO_ROOT_USER_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.ZO_ROOT_USER_PASSWORD }}
  ZO_ROOT_USER_PASSWORD: {{ . | quote }}
  {{- end }}
  ZO_ROOT_USER_TOKEN: "{{ .Values.auth.ZO_ROOT_USER_TOKEN }}"
  {{- end }}
  {{- if not .Values.minio.enabled }}
  ZO_S3_ACCESS_KEY: "{{ .Values.auth.ZO_S3_ACCESS_KEY }}"
  {{- else }}
  ZO_S3_ACCESS_KEY: "{{ .Values.minio.rootUser }}"
  {{- end }}
  {{- if not .Values.minio.enabled }}
  ZO_S3_SECRET_KEY: "{{ .Values.auth.ZO_S3_SECRET_KEY }}"
  {{- else }}
  ZO_S3_SECRET_KEY: "{{ .Values.minio.rootPassword }}"
  {{- end }}
  {{- if .Values.auth.ZO_META_POSTGRES_DSN }}
  ZO_META_POSTGRES_DSN: "{{ .Values.auth.ZO_META_POSTGRES_DSN }}"
  {{- else if .Values.config.ZO_META_POSTGRES_DSN }}
  ZO_META_POSTGRES_DSN: "{{ .Values.config.ZO_META_POSTGRES_DSN }}"
  {{- end }}
  # Credentials and tokens; kept out of the ConfigMap. Values still come from config.* in values.yaml.
  {{- with .Values.config.ZO_INTERNAL_GRPC_TOKEN }}
  ZO_INTERNAL_GRPC_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.ZO_EXT_AUTH_SALT }}
  ZO_EXT_AUTH_SALT: {{ . | quote }}
  {{- end }}
  {{- /* Self-tracing header: the user's value, else Basic auth from the root pair the user set, else */}}
  {{- /* the generated one. With only one of email/password set, or auth.existingRootUserSecret, it is empty. */}}
  {{- if .Values.config.ZO_TRACING_HEADER_VALUE }}
  ZO_TRACING_HEADER_VALUE: {{ .Values.config.ZO_TRACING_HEADER_VALUE | quote }}
  {{- else if and (not .Values.auth.existingRootUserSecret.name) .Values.auth.ZO_ROOT_USER_EMAIL .Values.auth.ZO_ROOT_USER_PASSWORD }}
  ZO_TRACING_HEADER_VALUE: {{ printf "Basic %s" (printf "%s:%s" .Values.auth.ZO_ROOT_USER_EMAIL .Values.auth.ZO_ROOT_USER_PASSWORD | b64enc) | quote }}
  {{- else if not (include "openobserve.generatedKeys" . | fromJson).tracing }}
  ZO_TRACING_HEADER_VALUE: ""
  {{- end }}
  ZO_USAGE_REPORTING_CREDS: "{{ .Values.config.ZO_USAGE_REPORTING_CREDS }}"
  ZO_ALERT_CHART_SIGNING_KEY: "{{ .Values.config.ZO_ALERT_CHART_SIGNING_KEY }}"
  ZO_RUM_CLIENT_TOKEN: "{{ .Values.config.ZO_RUM_CLIENT_TOKEN }}"
  {{- if eq .Values.config.ZO_S3_PROVIDER "azure" }}
  {{- with .Values.auth.AZURE_STORAGE_ACCOUNT_KEY | default .Values.config.AZURE_STORAGE_ACCOUNT_KEY }}
  AZURE_STORAGE_ACCOUNT_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.AZURE_STORAGE_ACCOUNT_NAME | default .Values.config.AZURE_STORAGE_ACCOUNT_NAME }}
  AZURE_STORAGE_ACCOUNT_NAME: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.enterprise.enabled }}
  {{- if .Values.auth.O2_AI_API_KEY }}
  O2_AI_API_KEY: "{{ .Values.auth.O2_AI_API_KEY }}"
  {{- end }}
  {{- if .Values.auth.O2_MCP_USERNAME }}
  O2_MCP_USERNAME: "{{ .Values.auth.O2_MCP_USERNAME }}"
  {{- end }}
  {{- if .Values.auth.O2_MCP_PASSWORD }}
  O2_MCP_PASSWORD: "{{ .Values.auth.O2_MCP_PASSWORD }}"
  {{- end }}
  {{- if .Values.auth.O2_AI_INTERNAL_SECRET }}
  O2_AI_INTERNAL_SECRET: {{ .Values.auth.O2_AI_INTERNAL_SECRET | quote }}
  {{- end }}
  {{- if .Values.enterprise.parameters.ZO_MASTER_ENCRYPTION_KEY }}
  O2_MASTER_ENCRYPTION_KEY: {{ .Values.enterprise.parameters.ZO_MASTER_ENCRYPTION_KEY | quote }}
  {{- end }}
  {{- end }}
