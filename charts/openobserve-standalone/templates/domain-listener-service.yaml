{{- $spd := include "openobserve.statusPageDomainsCfg" . | fromJson -}}
{{- if $spd.enabled }}
{{- /* A LoadBalancer of its own for the status page custom domains: 443 and 80 reach the listener ports of the one OpenObserve pod. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openobserve.domainListenerName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "openobserve.labels" . | nindent 4 }}
  {{- with $spd.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: {{ $spd.service.externalTrafficPolicy }}
  {{- with $spd.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  ports:
    - name: https
      port: {{ int $spd.service.httpsPort }}
      targetPort: domain-https
      protocol: TCP
    - name: http
      port: {{ int $spd.service.httpPort }}
      targetPort: domain-http
      protocol: TCP
  selector:
    {{- include "openobserve.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: openobserve
{{- end }}
