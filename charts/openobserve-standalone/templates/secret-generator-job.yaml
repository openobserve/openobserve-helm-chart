{{- if .Values.secretGenerator.enabled }}
{{- /*
Creates the per-install Secrets before anything else is applied. Runs as a Helm pre-install and
pre-upgrade hook and as an Argo CD PreSync hook, so "helm install/upgrade", "helm template | kubectl
apply" and Argo CD all behave the same. The Job only creates a missing Secret or adds missing keys.
*/}}
{{- $name := include "openobserve.secretGeneratorName" . }}
{{- $full := include "openobserve.fullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "openobserve.labels" . | nindent 4 }}
  annotations:
    {{- include "openobserve.secretGeneratorHookAnnotations" (dict "weight" "-20") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "openobserve.labels" . | nindent 4 }}
  annotations:
    {{- include "openobserve.secretGeneratorHookAnnotations" (dict "weight" "-20") | nindent 4 }}
rules:
  # Read the release's current Secrets and ConfigMap to copy the values an existing release uses.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ $full }}
      - {{ include "openobserve.generatedSecretName" . }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $full | quote }}]
    verbs: ["get"]
  # Its own creation time, to tell a new install from an existing release.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get"]
  # Add missing keys to the generated Secrets only.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "openobserve.generatedSecretName" . }}
    verbs: ["patch"]
  # "create" cannot be limited by name in RBAC.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "openobserve.labels" . | nindent 4 }}
  annotations:
    {{- include "openobserve.secretGeneratorHookAnnotations" (dict "weight" "-20") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "openobserve.labels" . | nindent 4 }}
  annotations:
    {{- include "openobserve.secretGeneratorHookAnnotations" (dict "weight" "-10") | nindent 4 }}
spec:
  backoffLimit: {{ .Values.secretGenerator.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.secretGenerator.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "openobserve.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: secret-generator
        {{- with include "openobserve.podLabels" (list .Values.podLabels .Values.secretGenerator.podLabels) }}
        {{- . | trim | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-generator
          image: "{{ .Values.secretGenerator.image.repository }}:{{ .Values.secretGenerator.image.tag }}"
          imagePullPolicy: {{ .Values.secretGenerator.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- include "openobserve.secretGeneratorScript" . | nindent 14 }}
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.secretGenerator.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
      {{- with .Values.secretGenerator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.secretGenerator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
