{{- /* Without postgres.spec.password the hook Job creates the role Secret (<fullname>-postgres-generated). */}}
{{- if and .Values.postgres.enabled .Values.postgres.spec.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openobserve.fullname" . }}-openobservepguser
  namespace: {{ .Release.Namespace | quote }}
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
data:
  username: b3Blbm9ic2VydmU=  # openobserve # this should match the role name in cluster
  password: {{ .Values.postgres.spec.password | b64enc}}
{{- end }}
