suite: Dex config and client secret stay out of ConfigMaps
set:
  enterprise.enabled: true
  enterprise.dex.enabled: true
release:
  name: oo
tests:
  - it: renders the Dex config as a Secret with the same file name
    template: templates/dex-secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: oo-openobserve-dex
      - matchRegex:
          path: stringData["config.docker.yaml"]
          pattern: "bindPW: Z54H7w5WQUARsLKaumM967iX62msTEno"
      - matchRegex:
          path: stringData["config.docker.yaml"]
          pattern: "secret: ZXhhbXBsZS1hcHAtc2VjcmV0"
  - it: renders no Dex config when Dex is off
    template: templates/dex-secret.yaml
    set:
      enterprise.dex.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: mounts the Secret at the same path and restarts Dex when the config changes
    template: templates/dex-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[0]
          value:
            name: config
            secret:
              secretName: oo-openobserve-dex
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/dex
            readOnly: true
      - exists:
          path: spec.template.metadata.annotations["checksum/dex-config"]
  - it: keeps podAnnotations next to the checksum
    template: templates/dex-deployment.yaml
    set:
      podAnnotations.dex:
        team: infra
    asserts:
      - equal:
          path: spec.template.metadata.annotations.team
          value: infra
      - exists:
          path: spec.template.metadata.annotations["checksum/dex-config"]
  - it: puts O2_DEX_CLIENT_SECRET in the Secret, not the ConfigMap
    templates:
      - templates/secret.yaml
      - templates/configmap.yaml
    asserts:
      - equal:
          path: stringData.O2_DEX_CLIENT_SECRET
          value: ZXhhbXBsZS1hcHAtc2VjcmV0
        template: templates/secret.yaml
      - notExists:
          path: data.O2_DEX_CLIENT_SECRET
        template: templates/configmap.yaml
  - it: keeps O2_DEX_CLIENT_SECRET in the ConfigMap with externalSecret, where the chart Secret isn't used
    template: templates/configmap.yaml
    set:
      externalSecret.enabled: true
      externalSecret.name: ext
    asserts:
      - equal:
          path: data.O2_DEX_CLIENT_SECRET
          value: ZXhhbXBsZS1hcHAtc2VjcmV0
  - it: restarts OpenObserve pods when the client secret changes
    templates:
      - templates/alertquerier-statefulset.yaml
      - templates/compactor-deployment.yaml
      - templates/ingester-statefulset.yaml
      - templates/querier-statefulset.yaml
      - templates/router-deployment.yaml
      - templates/scheduler-statefulset.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/dex-client-secret"]
  - it: leaves the client-secret checksum out with externalSecret
    template: templates/router-deployment.yaml
    set:
      externalSecret.enabled: true
      externalSecret.name: ext
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/dex-client-secret"]
