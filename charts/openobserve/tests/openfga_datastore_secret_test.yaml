suite: OpenFGA datastore URI Secret
set:
  enterprise.enabled: true
  enterprise.openfga.enabled: true
tests:
  - it: stores the bundled Postgres URI in its own Secret
    template: templates/openfga-datastore-secret.yaml
    release:
      name: oo
      namespace: o2
    set:
      postgres.spec.password: s3cret
    asserts:
      - equal:
          path: metadata.name
          value: oo-openobserve-openfga-datastore
      - equal:
          path: stringData.OPENFGA_DATASTORE_URI
          value: postgres://openobserve:s3cret@oo-openobserve-postgres-rw.o2.svc.cluster.local:5432/app?sslmode=disable
  - it: stores an external DSN when the bundled Postgres is off
    template: templates/openfga-datastore-secret.yaml
    set:
      postgres.enabled: false
      auth.ZO_META_POSTGRES_DSN: postgres://u:p@db:5432/o2
    asserts:
      - equal:
          path: stringData.OPENFGA_DATASTORE_URI
          value: postgres://u:p@db:5432/o2
  - it: renders no Secret with externalSecret
    template: templates/openfga-datastore-secret.yaml
    set:
      externalSecret.enabled: true
      externalSecret.name: mysec
    asserts:
      - hasDocuments:
          count: 0
  - it: keeps the password out of the OpenFGA pod spec
    template: templates/openfga-deployment.yaml
    set:
      postgres.spec.password: s3cret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENFGA_DATASTORE_URI
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-openobserve-openfga-datastore
                key: OPENFGA_DATASTORE_URI
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: OPENFGA_DATASTORE_URI
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-openobserve-openfga-datastore
                key: OPENFGA_DATASTORE_URI
  - it: rolls the OpenFGA pod when the URI changes
    template: templates/openfga-deployment.yaml
    set:
      postgres.spec.password: s3cret
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/openfga-datastore"]
  - it: leaves OpenFGA env untouched with externalSecret
    template: templates/openfga-deployment.yaml
    set:
      externalSecret.enabled: true
      externalSecret.name: mysec
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENFGA_DATASTORE_URI
          any: true
      - notExists:
          path: spec.template.metadata.annotations
