suite: report server user credentials
templates:
  - templates/secret.yaml
tests:
  - it: uses the root user when no report user is set
    asserts:
      - equal:
          path: stringData.ZO_REPORT_USER_EMAIL
          value: root@example.com
      - equal:
          path: stringData.ZO_REPORT_USER_PASSWORD
          value: "Complexpass#123"
  - it: uses auth.ZO_REPORT_USER_EMAIL and auth.ZO_REPORT_USER_PASSWORD when set
    set:
      auth.ZO_REPORT_USER_EMAIL: reports@example.com
      auth.ZO_REPORT_USER_PASSWORD: report-pass
    asserts:
      - equal:
          path: stringData.ZO_REPORT_USER_EMAIL
          value: reports@example.com
      - equal:
          path: stringData.ZO_REPORT_USER_PASSWORD
          value: report-pass
      - equal:
          path: stringData.ZO_ROOT_USER_EMAIL
          value: root@example.com
