suite: credential-class config values live in the Secret
set:
  config.ZO_INTERNAL_GRPC_TOKEN: grpc-token
  config.ZO_USAGE_REPORTING_CREDS: usage-creds
  config.ZO_ALERT_CHART_SIGNING_KEY: signing-key
  enterprise.parameters.O2_SUPER_CLUSTER_GRPC_TOKEN: super-cluster-token
  config.ZO_NATS_PASSWORD: nats-pass
  config.ZO_REPORT_USER_PASSWORD: report-pass
  auth.ZO_ROOT_USER_PASSWORD: root-pass
tests:
  - it: renders the values into the Secret unchanged
    template: templates/secret.yaml
    asserts:
      - equal:
          path: stringData.ZO_INTERNAL_GRPC_TOKEN
          value: grpc-token
      - equal:
          path: stringData.ZO_USAGE_REPORTING_CREDS
          value: usage-creds
      - equal:
          path: stringData.ZO_ALERT_CHART_SIGNING_KEY
          value: signing-key
      - equal:
          path: stringData.O2_SUPER_CLUSTER_GRPC_TOKEN
          value: super-cluster-token
      - equal:
          path: stringData.ZO_NATS_PASSWORD
          value: nats-pass
  - it: keeps the report user password the Secret already sets (the root password)
    template: templates/secret.yaml
    asserts:
      - equal:
          path: stringData.ZO_REPORT_USER_PASSWORD
          value: root-pass
  - it: keeps them out of the ConfigMap
    template: templates/configmap.yaml
    asserts:
      - notExists:
          path: data.ZO_INTERNAL_GRPC_TOKEN
      - notExists:
          path: data.ZO_USAGE_REPORTING_CREDS
      - notExists:
          path: data.ZO_ALERT_CHART_SIGNING_KEY
      - notExists:
          path: data.O2_SUPER_CLUSTER_GRPC_TOKEN
      - notExists:
          path: data.ZO_NATS_PASSWORD
      - notExists:
          path: data.ZO_REPORT_USER_PASSWORD
  - it: keeps them in the ConfigMap with externalSecret, where the chart Secret isn't used
    template: templates/configmap.yaml
    set:
      externalSecret.enabled: true
      externalSecret.name: ext
    asserts:
      - equal:
          path: data.ZO_INTERNAL_GRPC_TOKEN
          value: grpc-token
      - equal:
          path: data.ZO_USAGE_REPORTING_CREDS
          value: usage-creds
      - equal:
          path: data.ZO_ALERT_CHART_SIGNING_KEY
          value: signing-key
      - equal:
          path: data.O2_SUPER_CLUSTER_GRPC_TOKEN
          value: super-cluster-token
      - equal:
          path: data.ZO_NATS_PASSWORD
          value: nats-pass
      - equal:
          path: data.ZO_REPORT_USER_PASSWORD
          value: report-pass
