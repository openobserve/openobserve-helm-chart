suite: report server autoscaling
tests:
  - it: renders no HPA by default
    template: templates/reportserver-hpa.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: renders the HPA when autoscaling.reportserver.enabled is set
    template: templates/reportserver-hpa.yaml
    set:
      autoscaling.reportserver.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment
      - equal:
          path: spec.scaleTargetRef.name
          value: RELEASE-NAME-openobserve-reportserver
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 80
  - it: ignores a top-level autoscaling.enabled, which no other component reads
    templates:
      - templates/reportserver-hpa.yaml
      - templates/reportserver-delpoyment.yaml
    set:
      autoscaling.enabled: true
      replicaCount.reportserver: 3
    asserts:
      - hasDocuments:
          count: 0
        template: templates/reportserver-hpa.yaml
      - equal:
          path: spec.replicas
          value: 3
        template: templates/reportserver-delpoyment.yaml
  - it: sets replicas on the Deployment from replicaCount when autoscaling is off
    template: templates/reportserver-delpoyment.yaml
    set:
      replicaCount.reportserver: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
  - it: leaves replicas to the HPA when autoscaling is on
    template: templates/reportserver-delpoyment.yaml
    set:
      autoscaling.reportserver.enabled: true
    asserts:
      - notExists:
          path: spec.replicas
  - it: sets the release namespace on the Deployment
    template: templates/reportserver-delpoyment.yaml
    release:
      namespace: o2
    asserts:
      - equal:
          path: metadata.namespace
          value: o2
