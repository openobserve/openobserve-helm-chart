suite: master encryption key
tests:
  - it: puts the key in the Secret under the name the code reads
    template: templates/secret.yaml
    set:
      enterprise.parameters.ZO_MASTER_ENCRYPTION_KEY: a2V5
    asserts:
      - equal:
          path: stringData.O2_MASTER_ENCRYPTION_KEY
          value: a2V5
  - it: leaves the key out of the Secret when it is empty
    template: templates/secret.yaml
    asserts:
      - notExists:
          path: stringData.O2_MASTER_ENCRYPTION_KEY
  - it: keeps the key out of the ConfigMap
    template: templates/configmap.yaml
    set:
      enterprise.parameters.ZO_MASTER_ENCRYPTION_KEY: a2V5
    asserts:
      - notExists:
          path: data.O2_MASTER_ENCRYPTION_KEY
      - notExists:
          path: data.ZO_MASTER_ENCRYPTION_KEY
  - it: renders the algorithm under the name the code reads
    template: templates/configmap.yaml
    set:
      enterprise.parameters.ZO_MASTER_ENCRYPTION_ALGORITHM: aes-256-siv
    asserts:
      - equal:
          path: data.O2_MASTER_ENCRYPTION_ALGORITHM
          value: aes-256-siv
  - it: leaves an empty algorithm unset so the code default applies
    template: templates/configmap.yaml
    asserts:
      - notExists:
          path: data.O2_MASTER_ENCRYPTION_ALGORITHM
      - notExists:
          path: data.ZO_MASTER_ENCRYPTION_ALGORITHM
  - it: restarts every OpenObserve pod when the key changes
    templates:
      - templates/alertquerier-statefulset.yaml
      - templates/compactor-deployment.yaml
      - templates/ingester-statefulset.yaml
      - templates/querier-statefulset.yaml
      - templates/router-deployment.yaml
      - templates/scheduler-statefulset.yaml
    set:
      enterprise.parameters.ZO_MASTER_ENCRYPTION_KEY: a2V5
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/master-encryption-key"]
  - it: does not restart pods for an empty key
    templates:
      - templates/alertquerier-statefulset.yaml
      - templates/compactor-deployment.yaml
      - templates/ingester-statefulset.yaml
      - templates/querier-statefulset.yaml
      - templates/router-deployment.yaml
      - templates/scheduler-statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/master-encryption-key"]
  - it: does not restart pods for a key they never read under externalSecret
    templates:
      - templates/alertquerier-statefulset.yaml
      - templates/compactor-deployment.yaml
      - templates/ingester-statefulset.yaml
      - templates/querier-statefulset.yaml
      - templates/router-deployment.yaml
      - templates/scheduler-statefulset.yaml
    set:
      externalSecret.enabled: true
      enterprise.parameters.ZO_MASTER_ENCRYPTION_KEY: a2V5
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/master-encryption-key"]
  - it: derives the checksum from the key
    template: templates/ingester-statefulset.yaml
    release:
      name: r
    set:
      enterprise.parameters.ZO_MASTER_ENCRYPTION_KEY: a2V5
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/master-encryption-key"]
          value: bbd4240361b793222035f254f31c8b399a012a1cda085e6749350310ea513571
  - it: changes the checksum when the key changes
    template: templates/ingester-statefulset.yaml
    release:
      name: r
    set:
      enterprise.parameters.ZO_MASTER_ENCRYPTION_KEY: b3RoZXI=
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/master-encryption-key"]
          value: 61f4e78d5cf3de4dcae7c516e38772c644845decdc2f384d7c2c3acff2bd9073
