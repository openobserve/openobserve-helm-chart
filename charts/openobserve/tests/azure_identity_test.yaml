suite: Azure Blob credentials
tests:
  - it: writes the account key and name when they are set
    template: templates/secret.yaml
    set:
      config.ZO_S3_PROVIDER: azure
      auth.AZURE_STORAGE_ACCOUNT_KEY: account-key
      auth.AZURE_STORAGE_ACCOUNT_NAME: account-name
    asserts:
      - equal:
          path: stringData.AZURE_STORAGE_ACCOUNT_KEY
          value: account-key
      - equal:
          path: stringData.AZURE_STORAGE_ACCOUNT_NAME
          value: account-name
  - it: leaves a blank account key and name out of the Secret
    template: templates/secret.yaml
    set:
      config.ZO_S3_PROVIDER: azure
    asserts:
      - notExists:
          path: stringData.AZURE_STORAGE_ACCOUNT_KEY
      - notExists:
          path: stringData.AZURE_STORAGE_ACCOUNT_NAME
  - it: prefers auth.* over config.*
    template: templates/secret.yaml
    set:
      config.ZO_S3_PROVIDER: azure
      config.AZURE_STORAGE_ACCOUNT_KEY: config-key
      config.AZURE_STORAGE_ACCOUNT_NAME: config-name
      auth.AZURE_STORAGE_ACCOUNT_KEY: auth-key
    asserts:
      - equal:
          path: stringData.AZURE_STORAGE_ACCOUNT_KEY
          value: auth-key
      - equal:
          path: stringData.AZURE_STORAGE_ACCOUNT_NAME
          value: config-name
  - it: falls back to config.* when auth.* is empty
    template: templates/secret.yaml
    set:
      config.ZO_S3_PROVIDER: azure
      config.AZURE_STORAGE_ACCOUNT_KEY: config-key
    asserts:
      - equal:
          path: stringData.AZURE_STORAGE_ACCOUNT_KEY
          value: config-key
  - it: writes no Azure keys for other providers
    template: templates/secret.yaml
    set:
      auth.AZURE_STORAGE_ACCOUNT_KEY: account-key
    asserts:
      - notExists:
          path: stringData.AZURE_STORAGE_ACCOUNT_KEY
