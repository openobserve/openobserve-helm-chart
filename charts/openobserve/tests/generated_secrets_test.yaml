suite: per-install generated secrets
release:
  name: oo
  namespace: o2
tests:
  # --- hook Job -------------------------------------------------------------------------------
  - it: runs the generator as a Helm pre-install/pre-upgrade hook and an Argo CD PreSync hook
    template: templates/secret-generator-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: spec.template.spec.serviceAccountName
          value: oo-openobserve-secret-generator
  - it: creates the ServiceAccount, Role and RoleBinding before the Job
    template: templates/secret-generator-job.yaml
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-20"
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
        documentIndex: 3
  - it: limits the Role to the release's own Secrets, except create
    template: templates/secret-generator-job.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            resourceNames: [oo-openobserve-generated, oo-openobserve-postgres-generated]
            verbs: ["patch"]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get"]
  - it: generates the root user, tracing header, gRPC token, salt and Postgres password by default
    template: templates/secret-generator-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'state ZO_ROOT_USER_EMAIL email 0 "secret/\$CHART_SECRET/ZO_ROOT_USER_EMAIL" no'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'state ZO_ROOT_USER_PASSWORD password 32 '
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'derived ZO_TRACING_HEADER_VALUE'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'state ZO_INTERNAL_GRPC_TOKEN token 48 '
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'state password token 32 "secret/oo-openobserve-openobservepguser/password" yes'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'derived ZO_META_POSTGRES_DSN .*oo-openobserve-postgres-rw\.o2\.svc\.cluster\.local:5432/app'
  - it: never generates a salt for an existing release (no legacy source, not generated on an existing release)
    template: templates/secret-generator-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'state ZO_EXT_AUTH_SALT token 32 - no'
  - it: treats a release as existing only when its ConfigMap is older than the Job
    template: templates/secret-generator-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'if \[ "\$AGE" -gt 120 \]; then OLD=yes; fi'
  - it: lets existingRelease force the detection
    template: templates/secret-generator-job.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      secretGenerator.existingRelease: "true"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'case "true" in'
  - it: renders no generator when disabled and every value is set
    template: templates/secret-generator-job.yaml
    set:
      secretGenerator.enabled: false
      auth.ZO_ROOT_USER_EMAIL: admin@acme.test
      auth.ZO_ROOT_USER_PASSWORD: S3cure-Pass-For-Tests
      postgres.spec.password: pg-pass-for-tests
    asserts:
      - hasDocuments:
          count: 0
  - it: fails when disabled and a value is missing
    template: templates/secret.yaml
    set:
      secretGenerator.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "secretGenerator.enabled is false, so set: auth.ZO_ROOT_USER_EMAIL, auth.ZO_ROOT_USER_PASSWORD, postgres.spec.password"

  # --- user value wins ------------------------------------------------------------------------
  - it: keeps generated keys out of the chart Secret when they are not set
    template: templates/secret.yaml
    asserts:
      - notExists:
          path: stringData.ZO_ROOT_USER_EMAIL
      - notExists:
          path: stringData.ZO_ROOT_USER_PASSWORD
      - notExists:
          path: stringData.ZO_TRACING_HEADER_VALUE
      - notExists:
          path: stringData.ZO_INTERNAL_GRPC_TOKEN
      - notExists:
          path: stringData.ZO_EXT_AUTH_SALT
      - notExists:
          path: stringData.ZO_META_POSTGRES_DSN
  - it: renders the values the user sets, with the tracing header built from them
    template: templates/secret.yaml
    set:
      auth.ZO_ROOT_USER_EMAIL: admin@acme.test
      auth.ZO_ROOT_USER_PASSWORD: S3cure-Pass-For-Tests
      config.ZO_INTERNAL_GRPC_TOKEN: grpc-token-for-tests
      auth.ZO_EXT_AUTH_SALT: salt-for-tests-0123456789
    asserts:
      - equal:
          path: stringData.ZO_ROOT_USER_EMAIL
          value: admin@acme.test
      - equal:
          path: stringData.ZO_REPORT_USER_PASSWORD
          value: S3cure-Pass-For-Tests
      - equal:
          path: stringData.ZO_TRACING_HEADER_VALUE
          value: Basic YWRtaW5AYWNtZS50ZXN0OlMzY3VyZS1QYXNzLUZvci1UZXN0cw==
      - equal:
          path: stringData.ZO_INTERNAL_GRPC_TOKEN
          value: grpc-token-for-tests
      - equal:
          path: stringData.ZO_EXT_AUTH_SALT
          value: salt-for-tests-0123456789
  - it: leaves the tracing header empty when only one of email and password is set
    template: templates/secret.yaml
    set:
      auth.ZO_ROOT_USER_PASSWORD: S3cure-Pass-For-Tests
    asserts:
      - equal:
          path: stringData.ZO_TRACING_HEADER_VALUE
          value: ""
  - it: does not generate what the user set
    template: templates/secret-generator-job.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      auth.ZO_ROOT_USER_EMAIL: admin@acme.test
      auth.ZO_ROOT_USER_PASSWORD: S3cure-Pass-For-Tests
      config.ZO_INTERNAL_GRPC_TOKEN: grpc-token-for-tests
      auth.ZO_EXT_AUTH_SALT: salt-for-tests-0123456789
      postgres.spec.password: pg-pass-for-tests
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'state (ZO_ROOT_USER_EMAIL|ZO_ROOT_USER_PASSWORD|ZO_INTERNAL_GRPC_TOKEN|ZO_EXT_AUTH_SALT|password) '
  - it: gives pods the generated values through explicit env, which beats stale chart Secret keys
    template: templates/router-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZO_ROOT_USER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: oo-openobserve-generated
                key: ZO_ROOT_USER_PASSWORD
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZO_EXT_AUTH_SALT
            valueFrom:
              secretKeyRef:
                name: oo-openobserve-generated
                key: ZO_EXT_AUTH_SALT
                optional: true
      - equal:
          path: spec.template.spec.containers[0].envFrom[2]
          value:
            secretRef:
              name: oo-openobserve-generated
      - equal:
          path: spec.template.spec.containers[0].envFrom[3]
          value:
            secretRef:
              name: oo-openobserve
  - it: keeps the user's value by not adding env for it
    template: templates/ingester-statefulset.yaml
    set:
      auth.ZO_ROOT_USER_PASSWORD: S3cure-Pass-For-Tests
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZO_ROOT_USER_PASSWORD
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZO_ROOT_USER_EMAIL
          any: true
  - it: lets extraEnv override a generated value
    template: templates/querier-statefulset.yaml
    set:
      extraEnv:
        - name: ZO_EXT_AUTH_SALT
          value: from-extra-env-0123456789
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZO_EXT_AUTH_SALT
            value: from-extra-env-0123456789
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZO_EXT_AUTH_SALT
            valueFrom:
              secretKeyRef:
                name: oo-openobserve-generated
                key: ZO_EXT_AUTH_SALT
                optional: true

  # --- externalSecret -------------------------------------------------------------------------
  - it: generates no app values with externalSecret, and the external Secret still wins
    template: templates/compactor-deployment.yaml
    set:
      externalSecret.enabled: true
      externalSecret.name: ext
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZO_ROOT_USER_PASSWORD
          any: true
      - equal:
          path: spec.template.spec.containers[0].envFrom[3]
          value:
            secretRef:
              name: ext

  # --- Dex --------------------------------------------------------------------------------------
  - it: passes a generated Dex client secret with secretEnv, not in the config
    template: templates/dex-secret.yaml
    set:
      enterprise.enabled: true
      enterprise.dex.enabled: true
    asserts:
      - matchRegex:
          path: stringData["config.docker.yaml"]
          pattern: "secretEnv: O2_DEX_CLIENT_SECRET"
      - notMatchRegex:
          path: stringData["config.docker.yaml"]
          pattern: "secret: "
  - it: gives Dex only the generated client secret
    template: templates/dex-deployment.yaml
    set:
      enterprise.enabled: true
      enterprise.dex.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: O2_DEX_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: oo-openobserve-generated
                key: O2_DEX_CLIENT_SECRET
  - it: keeps a Dex client secret the user set
    template: templates/dex-secret.yaml
    set:
      enterprise.enabled: true
      enterprise.dex.enabled: true
      enterprise.dex.config.staticClients:
        - id: o2-client
          name: o2-client
          secret: user-client-secret
          redirectURIs: [https://o2.example.com/config/redirect]
    asserts:
      - matchRegex:
          path: stringData["config.docker.yaml"]
          pattern: "secret: user-client-secret"
  - it: ships no literal LDAP bind password
    template: templates/dex-secret.yaml
    set:
      enterprise.enabled: true
      enterprise.dex.enabled: true
    asserts:
      - matchRegex:
          path: stringData["config.docker.yaml"]
          pattern: 'bindPW: \$LDAP_BIND_PW'

  # --- bundled Postgres and pgAdmin ---------------------------------------------------------------
  - it: points the Postgres role at the generated Secret
    template: templates/postgres.yaml
    asserts:
      - equal:
          path: spec.managed.roles[0].passwordSecret.name
          value: oo-openobserve-postgres-generated
  - it: renders no Postgres user Secret without a password
    template: templates/postgres-secret.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: keeps the chart's Postgres user Secret when the user sets a password
    template: templates/postgres.yaml
    set:
      postgres.spec.password: pg-pass-for-tests
    asserts:
      - equal:
          path: spec.managed.roles[0].passwordSecret.name
          value: oo-openobserve-openobservepguser
  - it: builds the OpenFGA datastore URI in the pod from the generated password
    template: templates/openfga-deployment.yaml
    set:
      enterprise.enabled: true
      enterprise.openfga.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENFGA_DATASTORE_URI
            value: "postgres://openobserve:$(O2_POSTGRES_PASSWORD)@oo-openobserve-postgres-rw.o2.svc.cluster.local:5432/app?sslmode=disable"
  - it: reads the pgAdmin password from the generated Secret
    template: templates/pgadmin-sts.yaml
    set:
      postgres.pgadmin.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGADMIN_DEFAULT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: oo-openobserve-generated
                key: PGADMIN_DEFAULT_PASSWORD

  # --- published defaults ---------------------------------------------------------------------
  - it: fails a new install against a cluster that sets a published default
    template: templates/secret.yaml
    set:
      auth.ZO_ROOT_USER_PASSWORD: "Complexpass#123"
      postgres.spec.password: Batman123
    kubernetesProvider:
      scheme:
        "v1/ServiceAccount":
          gvr:
            version: v1
            resource: serviceaccounts
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: default
            namespace: o2
    asserts:
      - failedTemplate:
          errorPattern: "published defaults and must not be used on a new install: auth.ZO_ROOT_USER_PASSWORD, postgres.spec.password"
  - it: does not fail without cluster access (helm template, Argo CD)
    template: templates/secret.yaml
    set:
      auth.ZO_ROOT_USER_PASSWORD: "Complexpass#123"
    asserts:
      - notFailedTemplate: {}
  - it: does not fail an upgrade that still sets a published default
    template: templates/secret.yaml
    release:
      upgrade: true
    set:
      auth.ZO_ROOT_USER_PASSWORD: "Complexpass#123"
    asserts:
      - notFailedTemplate: {}
  - it: warns on upgrade, without printing the value
    template: templates/NOTES.txt
    release:
      upgrade: true
    set:
      auth.ZO_ROOT_USER_PASSWORD: "Complexpass#123"
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: these values are still published defaults"
      - matchRegexRaw:
          pattern: "- auth.ZO_ROOT_USER_PASSWORD"
      - notMatchRegexRaw:
          pattern: "Complexpass"

  # --- NOTES ------------------------------------------------------------------------------------
  - it: tells the user how to read the generated root credentials on install
    template: templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: "kubectl get secret --namespace o2 oo-openobserve-generated -o jsonpath='\\{.data.ZO_ROOT_USER_PASSWORD\\}' \\| base64 -d"
      - matchRegexRaw:
          pattern: "password manager"
      - matchRegexRaw:
          pattern: "ZO_INTERNAL_GRPC_TOKEN, ZO_EXT_AUTH_SALT"
  - it: says the user's own values are used when set
    template: templates/NOTES.txt
    set:
      auth.ZO_ROOT_USER_EMAIL: admin@acme.test
      auth.ZO_ROOT_USER_PASSWORD: S3cure-Pass-For-Tests
    asserts:
      - matchRegexRaw:
          pattern: "Password: the auth.ZO_ROOT_USER_PASSWORD you set."
      - notMatchRegexRaw:
          pattern: "S3cure-Pass-For-Tests"
