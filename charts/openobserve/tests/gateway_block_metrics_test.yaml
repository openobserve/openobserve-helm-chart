suite: gateway metrics block
templates:
  - templates/httproute.yaml
  - templates/gateway-block-metrics-filter.yaml
set:
  gateway.enabled: true
tests:
  - it: answers /metrics and /api/metrics with 403
    asserts:
      - equal:
          path: spec.directResponse.statusCode
          value: 403
        template: templates/gateway-block-metrics-filter.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openobserve-block-metrics
        template: templates/gateway-block-metrics-filter.yaml
      - equal:
          path: spec.rules[0].filters[0].extensionRef.name
          value: RELEASE-NAME-openobserve-block-metrics
        template: templates/httproute.yaml
      - equal:
          path: spec.rules[1].filters[0].extensionRef.name
          value: RELEASE-NAME-openobserve-block-metrics
        template: templates/httproute.yaml
