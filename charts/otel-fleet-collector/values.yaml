# Default values for otel-fleet-collector.
#
# The chart runs OpenTelemetry Collectors under the OpAMP supervisor, either as agents
# (agent.enabled, a DaemonSet with one collector per node) or as gateways
# (gateway.enabled, a StatefulSet). One release runs exactly one of the two: a release
# enrols with one fleet enrollment token and every collector of a fleet runs the same
# configuration, so agents and gateways are two releases in two fleets. The collector
# configuration is NOT part of this chart: the supervisor enrols against OpenObserve and
# receives its configuration from the server (Fleet management in the OpenObserve UI).

image:
  repository: o2cr.ai/openobserve/otel-fleet-collector
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.163.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []

opamp:
  # The OpAMP endpoint of the OpenObserve server, as a websocket URL:
  #   ws://<host>:5080/api/<org>/v1/opamp   or   wss://<host>/api/<org>/v1/opamp
  # The "Add collector" dialog in the OpenObserve UI prints it. Required.
  endpoint: ""
  # The fleet enrollment token from the same dialog. Stored in a Secret created by the
  # chart. Leave empty and set existingSecret to keep the token out of values.
  token: ""
  # Name of an existing Secret in the release namespace holding the enrollment token.
  # Takes precedence over opamp.token.
  existingSecret: ""
  # Key inside existingSecret that holds the token.
  existingSecretKey: token
  # Skip TLS certificate verification (self-signed OpenObserve). Plain ws:// endpoints
  # get `tls.insecure: true` automatically, like the Docker install command does.
  insecureTls: false

supervisor:
  # Forward the collector's own logs to the pod's stdout/stderr so `kubectl logs` shows them.
  passthroughLogs: true

# Name of this Kubernetes cluster, exposed to the collector as the K8S_CLUSTER_NAME environment
# variable. Kubernetes has no cluster name of its own, so a fleet configuration shared by several
# clusters tags its data with `${env:K8S_CLUSTER_NAME}` (see the chart README). The collector also
# gets K8S_NODE_NAME, K8S_POD_NAME and K8S_NAMESPACE, and agents K8S_NODE_IP (the node's IP, for
# kubeletstats). Fleet configurations can rely on these and on nothing else from the pod.
clusterName: ""

# Agent: a DaemonSet with one collector per node, for node-local data (pod logs, journald,
# host metrics, kubelet stats, OTLP from the pods on that node).
agent:
  enabled: true

  storage:
    # Supervisor state (instance id, last received config) on the node, so a pod restart
    # or upgrade keeps the same agent identity in Fleet management.
    hostPath: /var/lib/opampsupervisor

  # Host log directories mounted read-only into the collector, since server-delivered
  # configurations commonly use the filelog receiver to collect container logs.
  #
  # Node log files are root-owned and not world-readable (/var/log/pods is
  # drwxr-x--- root root), so with hostLogs.enabled the supervisor container runs as
  # root with the DAC_READ_SEARCH capability added, which grants read-only access to
  # root-owned files; the same approach the upstream OpenTelemetry collector chart takes
  # for log collection. The hostPath state directory is then root-owned. Everything
  # else stays locked down: read-only root filesystem, no privilege escalation, all other
  # capabilities dropped, RuntimeDefault seccomp.
  #
  # With hostLogs.enabled: false the pod runs as the image's non-root uid 65532 instead,
  # and the init container chowns the state directory to that uid.
  hostLogs:
    enabled: true
    paths:
      - /var/log/pods
      - /var/lib/docker/containers

  # The node's root filesystem mounted read-only at /hostfs, so fleet configurations can use the
  # hostmetrics receiver with `root_path: /hostfs` and report the node's disks, filesystems,
  # network and processes rather than the collector container's. A configuration that sets
  # root_path: /hostfs fails to start without it ("stat /hostfs: no such file or directory").
  hostMetrics:
    enabled: true

  # Read access to pods, namespaces, nodes and replicasets for the k8sattributes processor (pod
  # IP, deployment name and labels of the pods on the node), and nodes/stats + nodes/proxy for
  # kubeletstats.
  clusterRole:
    create: true
    # Extra rules appended to the ClusterRole.
    rules: []

  # Supervisor container resources. Left empty like the upstream collector charts; for
  # production set a memory limit above the configuration's memory_limiter (for example
  # requests 100m / 256Mi and limits.memory 768Mi with limit_mib: 512). Add /var/log/journal to
  # hostLogs.paths when the configuration uses the journald receiver.
  resources: {}

  nodeSelector: {}

  # Run on every node, including control-plane nodes.
  tolerations:
    - operator: Exists

  affinity: {}

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

# Gateway: a StatefulSet for cluster-level collection (k8s_cluster, k8s_events, Prometheus
# scraping), OTLP from the agents, tail sampling and one egress to OpenObserve. It mounts
# nothing from the nodes and runs as uid 65532 without capabilities.
gateway:
  enabled: false

  # Every replica runs the fleet's configuration. k8s_cluster, k8s_events and k8sobjects
  # bound to the k8s_leader_elector extension run on one replica at a time, but the
  # prometheus receiver cannot be, so with more replicas every replica scrapes every target
  # and the samples are duplicated; tail_sampling also needs all spans of a trace on one
  # replica. Keep 1 replica when the configuration uses either.
  replicas: 1

  # One volume per replica for the supervisor state (instance id, last received config), so
  # a rescheduled pod keeps its identity in Fleet management. With enabled: false the state
  # is an emptyDir and every new pod enrols as a new collector.
  persistence:
    enabled: true
    size: 1Gi
    # Empty uses the cluster's default StorageClass; "-" sets storageClassName: "".
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  # ClusterIP Service the agents export OTLP to, plus a headless Service for per-pod DNS.
  # The fleet configuration's otlp receiver must listen on 0.0.0.0, not the default localhost.
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
    ports:
      - name: otlp-grpc
        port: 4317
      - name: otlp-http
        port: 4318

  # Read access to cluster objects (k8s_cluster, k8s_events, k8sobjects, k8sattributes,
  # kubernetes_sd_configs), the kubelet's cAdvisor and /metrics endpoints for prometheus, and
  # the Leases k8s_leader_elector takes.
  clusterRole:
    create: true
    # Also read configmaps, RBAC objects and CRDs for k8sobjects. Off by default: it hands
    # cluster configuration to the telemetry pipeline.
    sensitiveObjects: false
    # Extra rules appended to the ClusterRole.
    rules: []

  # Supervisor container resources. For production set a memory limit above the
  # configuration's memory_limiter (for example requests 200m / 512Mi and limits.memory 1536Mi
  # with limit_mib: 1024).
  resources: {}

  nodeSelector: {}

  tolerations: []

  affinity: {}

# The image is distroless (no shell). This init container, run as root, renders the
# enrollment token into supervisor.yaml and chowns the state directory to the uid the
# supervisor runs as (root for agents with hostLogs.enabled, 65532 otherwise).
initContainer:
  image:
    repository: busybox
    tag: "1.37"
    pullPolicy: IfNotPresent
  resources: {}

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# Pod security context. For agents with hostLogs.enabled (see above) the chart overrides
# runAsUser/runAsGroup to 0 and runAsNonRoot to false; otherwise these apply as is.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Supervisor container security context. For agents with hostLogs.enabled the chart adds
# the DAC_READ_SEARCH capability; otherwise this applies as is.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Extra environment variables for the supervisor (and, through it, the collector).
extraEnv: []

priorityClassName: ""

# The supervisor stops the collector with SIGTERM and SIGKILLs it after 10s; keep this >= 15.
terminationGracePeriodSeconds: 30

extraVolumes: []
extraVolumeMounts: []
