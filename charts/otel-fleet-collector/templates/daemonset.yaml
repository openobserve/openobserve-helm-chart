apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "otel-fleet-collector.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "otel-fleet-collector.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "otel-fleet-collector.selectorLabels" . | nindent 6 }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.opamp.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "otel-fleet-collector.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "otel-fleet-collector.serviceAccountName" . }}
      hostNetwork: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Runs as root: the hostPath state directory is created root-owned, and the
        # distroless supervisor image has no shell to render the token into the config.
        - name: init
          image: "{{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.initContainer.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          command:
            - /bin/sh
            - -ec
            - |
              chown -R 65532:65532 /var/lib/opampsupervisor
              AUTH=$(printf 'fleet:%s' "$O2_FLEET_TOKEN" | base64 | tr -d '\n')
              sed "s|__O2_FLEET_AUTH__|$AUTH|g" /etc/opampsupervisor-template/supervisor.yaml > /etc/opampsupervisor/supervisor.yaml
          env:
            - name: O2_FLEET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "otel-fleet-collector.secretName" . }}
                  key: {{ include "otel-fleet-collector.secretKey" . }}
          {{- with .Values.initContainer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/opampsupervisor
            - name: config-template
              mountPath: /etc/opampsupervisor-template
              readOnly: true
            - name: config
              mountPath: /etc/opampsupervisor
      containers:
        - name: supervisor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/opampsupervisor
              readOnly: true
            - name: state
              mountPath: /var/lib/opampsupervisor
            {{- if .Values.hostLogs.enabled }}
            {{- range $i, $p := .Values.hostLogs.paths }}
            - name: hostlog-{{ $i }}
              mountPath: {{ $p }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config-template
          configMap:
            name: {{ include "otel-fleet-collector.fullname" . }}
        - name: config
          emptyDir: {}
        - name: state
          hostPath:
            path: {{ .Values.storage.hostPath }}
            type: DirectoryOrCreate
        {{- if .Values.hostLogs.enabled }}
        {{- range $i, $p := .Values.hostLogs.paths }}
        - name: hostlog-{{ $i }}
          hostPath:
            path: {{ $p }}
            type: DirectoryOrCreate
        {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
