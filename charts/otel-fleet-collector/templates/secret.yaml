{{- if not .Values.opamp.existingSecret }}
{{- if not .Values.opamp.token }}
{{- fail "opamp.token is required (the fleet enrollment token), or set opamp.existingSecret to a Secret that holds it" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otel-fleet-collector.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "otel-fleet-collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.opamp.token | quote }}
{{- end }}
