{{- $insecure := include "otel-fleet-collector.insecureTls" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-fleet-collector.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "otel-fleet-collector.labels" . | nindent 4 }}
data:
  # Template of /etc/opampsupervisor/supervisor.yaml. The init container replaces
  # __O2_FLEET_AUTH__ with base64("fleet:<token>") read from the Secret; the token itself
  # never lands in this ConfigMap.
  supervisor.yaml: |
    server:
      endpoint: {{ include "otel-fleet-collector.opampEndpoint" . }}
      headers:
        Authorization: "Basic __O2_FLEET_AUTH__"
    {{- if $insecure }}
      tls:
        insecure: true
    {{- end }}
    capabilities:
      accepts_remote_config: true
      reports_effective_config: true
      reports_health: true
      reports_own_metrics: true
      accepts_restart_command: true
      reports_available_components: true
    agent:
      executable: /usr/local/bin/otelcol-contrib
    {{- if .Values.supervisor.passthroughLogs }}
      passthrough_logs: true
    {{- end }}
      env:
        O2_ENDPOINT: {{ include "otel-fleet-collector.o2Endpoint" . }}
        O2_TOKEN: "Basic __O2_FLEET_AUTH__"
    storage:
      directory: /var/lib/opampsupervisor
